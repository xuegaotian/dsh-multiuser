name: Bug report
description: Report a reproducible problem in dsh-multiuser.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Do not include passwords, API keys, tokens, cookies, database files, or user data.
  - type: input
    id: version
    attributes:
      label: dsh-multiuser version
      description: Which package version shows the problem?
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: What does `node --version` print?
      placeholder: v22.19.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
